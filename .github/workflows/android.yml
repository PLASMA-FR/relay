name: Android
on:
  push:
    paths: ['mobile/**', 'internal/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'internal/**', 'go.mod', 'go.sum', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            go.sum
            mobile/bind/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: ./mobile/build-core.sh
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
        working-directory: mobile/android
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd mobile/android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Collect real emulator captures
        if: always()
        run: adb pull /sdcard/Android/data/io.github.plasmafr.relay.debug/files/screenshots mobile/android/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-android
          path: |
            mobile/android/app/build/outputs/apk/
            mobile/android/app/build/reports/
            mobile/android/screenshots/
